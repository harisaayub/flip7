name: Android Debug Build

on:
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'android-speedometer/**'
      - '.github/workflows/android-debug-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-speedometer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedometer-debug-apk
          path: android-speedometer/app/build/outputs/apk/debug/app-debug.apk

      - name: Compute rolling release tag
        id: vars
        run: echo "tag=dev-build-$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Publish rolling dev release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.vars.outputs.tag }}
          name: Dev build — ${{ github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: true
          artifacts: android-speedometer/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automatically built debug APK from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            Debug-signed, for on-device testing only — not for distribution.
            This release is overwritten on every push to this branch.
